video:
  max_resolution: 720
  working_filename: source.mp4
segmentation:
  shot_detector: adaptive
  scene_detector: semantic
  shot_threshold: 18.0
  shot_adaptive_threshold: 3.0
  shot_min_content_value: 15.0
  scene_threshold: 30.0
  min_scene_seconds: 2.0
  audio_boundary_window_seconds: 0.75
  scene_visual_similarity_threshold: 0.55
  scene_audio_boundary_threshold: 0.65
faces:
  detector_backend: opencv
  emotion_backend: opencv
  similarity_threshold: 0.72
  frame_sample_rate_seconds: 1.0
objects:
  model_name: yolov8n.pt
  confidence: 0.35
  frame_sample_rate_seconds: 1.0
llm:
  model: gpt-4.1-mini
audio:
  music_min_duration_seconds: 3.0
  music_energy_percentile: 65
  mood_sample_rate: 22050
  mood_minimum_score: 0.25
  mood_max_labels: 2
  yamnet_enabled: true
  yamnet_sample_rate: 16000
  yamnet_model_url: https://tfhub.dev/google/yamnet/1
  yamnet_confidence_threshold: 0.20
  yamnet_max_events: 8
