[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-video-intelligence"
version = "0.1.0"
description = "Audio-aware YouTube shot/scene analysis with faces, emotions, objects, scene mood, descriptions, and background music ranges."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.7",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "scenedetect[opencv]>=0.6.4",
    "yt-dlp>=2024.7.1",
    "moviepy>=1.0.3",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "scikit-learn>=1.5.0",
    "openai>=1.40.0",
    "ultralytics>=8.2.0",
    "deepface>=0.0.92",
    "av>=17.1.0",
    "tf-keras>=2.21.0",
    "uv>=0.11.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
video-intel = "video_intelligence.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

